<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>封面 · Design Skill</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0b;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: "Noto Sans SC", system-ui, sans-serif;
    }

    /* 公众号封面常见比例 ~2.35:1，也兼容 16:9 裁切 */
    .cover {
      position: relative;
      width: 1200px;
      height: 510px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 70% at 85% 20%, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(ellipse 60% 80% at 10% 90%, rgba(99, 102, 241, 0.16), transparent 50%),
        linear-gradient(165deg, #0c0c10 0%, #111118 45%, #0a0a0e 100%);
      color: #f4f4f5;
      isolation: isolate;
    }

    /* 细网格 */
    .cover::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, black 20%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    /* 斜切光带 */
    .beam {
      position: absolute;
      top: -20%;
      right: 8%;
      width: 2px;
      height: 140%;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(56, 189, 248, 0.55) 30%,
        rgba(165, 180, 252, 0.35) 55%,
        transparent
      );
      transform: rotate(18deg);
      filter: blur(0.5px);
      z-index: 1;
      opacity: 0.7;
    }

    .beam--soft {
      right: 18%;
      width: 80px;
      background: linear-gradient(
        180deg,
        transparent,
        rgba(56, 189, 248, 0.08) 40%,
        transparent
      );
      filter: blur(24px);
      opacity: 1;
    }

    .frame {
      position: absolute;
      inset: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 2;
      pointer-events: none;
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(56, 189, 248, 0.12);
    }

    .inner {
      position: relative;
      z-index: 3;
      height: 100%;
      padding: 44px 56px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(125, 211, 252, 0.95);
    }

    .eyebrow .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
    }

    .meta-right {
      text-align: right;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      line-height: 1.6;
      color: rgba(161, 161, 170, 0.9);
      letter-spacing: 0.08em;
    }

    .hero {
      margin-top: 8px;
      max-width: 920px;
    }

    .kicker {
      font-size: 15px;
      font-weight: 500;
      color: rgba(228, 228, 231, 0.72);
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }

    .title {
      font-weight: 900;
      font-size: 64px;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: #fafafa;
      text-wrap: balance;
    }

    .title .accent {
      display: inline;
      background: linear-gradient(100deg, #7dd3fc 0%, #a5b4fc 45%, #f0abfc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .title .line2 {
      display: block;
      margin-top: 6px;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #e4e4e7;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 7px 11px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(228, 228, 231, 0.88);
      border-radius: 2px;
    }

    .tag--hi {
      border-color: rgba(56, 189, 248, 0.35);
      color: #bae6fd;
      background: rgba(14, 165, 233, 0.08);
    }

    .issue {
      text-align: right;
    }

    .issue .num {
      font-family: "Instrument Serif", "Noto Sans SC", serif;
      font-style: italic;
      font-size: 42px;
      line-height: 1;
      color: rgba(250, 250, 250, 0.92);
      letter-spacing: -0.02em;
    }

    .issue .label {
      margin-top: 6px;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(113, 113, 122, 1);
    }

    /* 右下角装饰大字水印 */
    .watermark {
      position: absolute;
      right: -20px;
      bottom: -48px;
      font-weight: 900;
      font-size: 220px;
      line-height: 0.8;
      letter-spacing: -0.06em;
      color: rgba(255, 255, 255, 0.03);
      z-index: 1;
      user-select: none;
      pointer-events: none;
      font-family: "Noto Sans SC", sans-serif;
    }
  </style>
</head>
<body>
  <div class="cover" id="cover">
    <div class="beam beam--soft"></div>
    <div class="beam"></div>
    <div class="frame"></div>
    <div class="watermark">SKILL</div>
    <div class="inner">
      <div class="top">
        <div class="eyebrow">
          <span class="dot"></span>
          <span>TECH · MOTION · AGENTS</span>
        </div>
        <div class="meta-right">
          DESIGN ENGINEERING<br />
          emilkowalski / skills
        </div>
      </div>

      <div class="hero">
        <p class="kicker">给做产品原型与前端的同学</p>
        <h1 class="title">
          <span class="accent">先问该不该动</span>
          <span class="line2">再谈怎么动</span>
        </h1>
      </div>

      <div class="bottom">
        <div class="tags">
          <span class="tag tag--hi">ease-out</span>
          <span class="tag">别 scale(0)</span>
          <span class="tag">频率门控</span>
          <span class="tag">去 AI 味</span>
        </div>
        <div class="issue">
          <div class="num">No. 07</div>
          <div class="label">Cover Feature</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
